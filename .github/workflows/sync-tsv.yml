
name: Sync Google Sheets to TSV

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tsv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest Google Sheet
        run: |
          curl -fLsS --retry 3 \
            "https://docs.google.com/spreadsheets/d/1pIrv23bmeWwMQPCddqazZUESgZ8awfpmmSMmN7vB4bw/export?format=tsv&gid=2041180650" \
            -o coba.tsv

          head -n 1 coba.tsv | grep -q "username"

      - name: Commit updated file
        run: |
          if git diff --quiet -- coba.tsv; then
            echo "No changes found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add coba.tsv
          git commit -m "Auto-update TSV from Google Sheets"
          git push
